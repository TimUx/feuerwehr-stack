name: Release checksums

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # scripts/update.sh verifies every downloaded file against this list. It is uploaded once and
      # deliberately never overwritten: if the tag is moved later, the files no longer match.
      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS"
